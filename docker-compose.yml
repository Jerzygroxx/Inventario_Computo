services:
  db:
    image: mysql:8.4
    container_name: inventario-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: inventario2024
      MYSQL_DATABASE: inventario_computo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database:/docker-entrypoint-initdb.d
      - ./backend/database/client.cnf:/etc/mysql/conf.d/client.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inventario-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: inventario2024
      DB_NAME: inventario_computo
      PORT: 4000
      JWT_SECRET: inventario_prod_secret_2024
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: inventario-frontend
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
